<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM API Reference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #0B0D14;
  --surface: #151820;
  --elevated: #1F2235;
  --border: #252A3A;
  --border-strong: #323750;
  --accent: #818CF8;
  --accent-dim: #1A1C35;
  --accent-hover: #A5B4FC;
  --text: #E2E8F0;
  --text-2: #94A3B8;
  --text-3: #475569;
  --get: #38BDF8;    --get-bg: #0C2030;
  --post: #4ADE80;   --post-bg: #0A2015;
  --patch: #FB923C;  --patch-bg: #251408;
  --delete: #F87171; --delete-bg: #250A0A;
  --json-key: #93C5FD; --json-str: #86EFAC;
  --json-num: #FCA5A5; --json-bool: #A78BFA; --json-null: #94A3B8;
  --sidebar-w: 264px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F1F3F9; --surface: #FFFFFF; --elevated: #F8F9FC;
    --border: #E2E6F0; --border-strong: #C9D0E4;
    --accent: #6366F1; --accent-dim: #EEF2FF; --accent-hover: #4F46E5;
    --text: #1E2235; --text-2: #4B5480; --text-3: #94A3B8;
    --get: #0369A1; --get-bg: #E0F2FE;
    --post: #15803D; --post-bg: #DCFCE7;
    --patch: #C2410C; --patch-bg: #FFF7ED;
    --delete: #BE123C; --delete-bg: #FFF1F2;
    --json-key: #1D4ED8; --json-str: #15803D;
    --json-num: #B45309; --json-bool: #7C3AED; --json-null: #64748B;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0D14; --surface: #151820; --elevated: #1F2235;
  --border: #252A3A; --border-strong: #323750;
  --accent: #818CF8; --accent-dim: #1A1C35; --accent-hover: #A5B4FC;
  --text: #E2E8F0; --text-2: #94A3B8; --text-3: #475569;
  --get: #38BDF8; --get-bg: #0C2030; --post: #4ADE80; --post-bg: #0A2015;
  --patch: #FB923C; --patch-bg: #251408; --delete: #F87171; --delete-bg: #250A0A;
  --json-key: #93C5FD; --json-str: #86EFAC;
  --json-num: #FCA5A5; --json-bool: #A78BFA; --json-null: #94A3B8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}
code, .mono { font-family: 'JetBrains Mono', monospace; }

/* ── Topbar ── */
.topbar {
  height: 52px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding-inline: 16px; flex-shrink: 0; z-index: 20;
}
.topbar-brand {
  font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px;
  color: var(--text); display: flex; align-items: center; gap: 8px; white-space: nowrap;
}
.topbar-brand .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px var(--accent);
}
.topbar-divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
.config-row { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.config-input {
  background: var(--elevated); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 10px; color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 11px; outline: none; min-width: 0; transition: border-color 0.15s;
}
.config-input:focus { border-color: var(--accent); }
.config-input.url { flex: 2; } .config-input.email, .config-input.pass { flex: 1; }
.btn {
  padding: 5px 12px; border-radius: 6px; border: none; cursor: pointer;
  font-size: 12px; font-weight: 500; font-family: 'Inter', sans-serif;
  white-space: nowrap; transition: all 0.15s;
}
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { background: var(--accent-hover); }
.btn-ghost { background: var(--elevated); color: var(--text-2); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--border-strong); color: var(--text); }
.auth-status { font-size: 11px; color: var(--post); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
.auth-status.error { color: var(--delete); }

/* ── Layout ── */
.layout { display: flex; flex: 1; min-height: 0; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
}
.sidebar-search {
  padding: 12px; position: sticky; top: 0;
  background: var(--surface); border-bottom: 1px solid var(--border); z-index: 5;
}
.search-input {
  width: 100%; background: var(--elevated); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 12px; outline: none;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text-3); }
.resource-group { border-bottom: 1px solid var(--border); }
.resource-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; cursor: pointer; user-select: none; transition: background 0.1s;
}
.resource-header:hover { background: var(--elevated); }
.resource-name { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); }
.resource-toggle { color: var(--text-3); font-size: 10px; transition: transform 0.15s; }
.resource-group.open .resource-toggle { transform: rotate(90deg); }
.endpoint-list { display: none; }
.resource-group.open .endpoint-list { display: block; }
.endpoint-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px 6px 16px; cursor: pointer; transition: background 0.1s; min-width: 0;
}
.endpoint-item:hover { background: var(--elevated); }
.endpoint-item.active { background: var(--accent-dim); }
.endpoint-item.active .ep-path { color: var(--accent-hover); }
.method-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600;
  padding: 2px 5px; border-radius: 3px; letter-spacing: 0.04em;
  flex-shrink: 0; width: 46px; text-align: center;
}
.method-GET    { color: var(--get);    background: var(--get-bg); }
.method-POST   { color: var(--post);   background: var(--post-bg); }
.method-PATCH  { color: var(--patch);  background: var(--patch-bg); }
.method-DELETE { color: var(--delete); background: var(--delete-bg); }
.ep-path { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* ── Main ── */
.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
.welcome {
  flex: 1; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px; padding: 40px; text-align: center;
}
.welcome-icon { font-size: 48px; opacity: 0.15; }
.welcome h2 { color: var(--text-2); font-size: 16px; font-weight: 500; }
.welcome p { color: var(--text-3); font-size: 13px; max-width: 340px; line-height: 1.6; }
.endpoint-detail { padding: 28px 32px; max-width: 860px; }
.ep-header { margin-bottom: 24px; }
.ep-title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.method-badge-lg { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 5px; }
.ep-path-lg { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500; color: var(--text); }
.ep-auth-badge {
  font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 10px;
  background: var(--elevated); border: 1px solid var(--border); color: var(--text-3); letter-spacing: 0.04em;
}
.ep-auth-badge.required { color: var(--patch); border-color: var(--patch-bg); background: var(--patch-bg); }
.ep-description { color: var(--text-2); font-size: 13px; line-height: 1.65; margin-top: 8px; }
.section { margin-bottom: 24px; }
.section-title { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
.param-table { width: 100%; border-collapse: collapse; }
.param-table th, .param-table td { text-align: left; padding: 7px 10px; font-size: 12px; border-bottom: 1px solid var(--border); }
.param-table th { color: var(--text-3); font-weight: 500; background: var(--elevated); }
.param-table td { color: var(--text); }
.param-table td:first-child { font-family: 'JetBrains Mono', monospace; color: var(--accent); }
.param-table td:nth-child(2) { color: var(--text-3); font-style: italic; }
.required-dot { color: var(--delete); margin-left: 2px; }
.code-block {
  background: var(--elevated); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
  line-height: 1.6; overflow-x: auto; white-space: pre;
}
.response-examples { display: flex; flex-direction: column; gap: 10px; }
.response-status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.status-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.s2xx { background: var(--post-bg); color: var(--post); }
.s4xx { background: var(--patch-bg); color: var(--patch); }
.s5xx { background: var(--delete-bg); color: var(--delete); }
.status-desc { font-size: 12px; color: var(--text-2); }

/* ── Try It ── */
.tryit-section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 24px; }
.tryit-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--elevated); }
.tryit-header h3 { font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: 0.04em; }
.tryit-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.tryit-url-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--elevated); border: 1px solid var(--border);
  border-radius: 7px; padding: 8px 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
}
.tryit-url-method { font-weight: 600; flex-shrink: 0; }
.tryit-url-text { color: var(--text-2); flex: 1; min-width: 0; word-break: break-all; }
.tryit-param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tryit-field { display: flex; flex-direction: column; gap: 4px; }
.tryit-label { font-size: 10px; font-weight: 600; color: var(--text-3); letter-spacing: 0.05em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
.tryit-input {
  background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
  padding: 6px 10px; color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 12px; outline: none; transition: border-color 0.15s; width: 100%;
}
.tryit-input:focus { border-color: var(--accent); }
.tryit-body-area {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 12px; color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 12px; line-height: 1.6; resize: vertical; min-height: 120px; outline: none;
  width: 100%; transition: border-color 0.15s;
}
.tryit-body-area:focus { border-color: var(--accent); }
.tryit-actions { display: flex; align-items: center; gap: 10px; }
.btn-send {
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; transition: background 0.15s;
}
.btn-send:hover { background: var(--accent-hover); }
.btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
.tryit-timing { font-size: 11px; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
.response-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.response-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--elevated); }
.response-code { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
.response-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); }
.response-body { padding: 12px 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre; max-height: 360px; overflow-y: auto; }
.json-key { color: var(--json-key); } .json-str { color: var(--json-str); }
.json-num { color: var(--json-num); } .json-bool { color: var(--json-bool); } .json-null { color: var(--json-null); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
@media (max-width: 680px) {
  :root { --sidebar-w: 0px; }
  .sidebar { display: none; }
  .config-input.email, .config-input.pass { display: none; }
  .endpoint-detail { padding: 16px; }
  .tryit-param-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand"><span class="dot"></span>CRM API</div>
  <div class="topbar-divider"></div>
  <div class="config-row">
    <input class="config-input url" id="cfg-base" placeholder="Base URL">
    <input class="config-input email" id="cfg-email" value="admin@crm.dev" placeholder="email">
    <input class="config-input pass" id="cfg-pass" value="Admin123!" type="password" placeholder="password">
    <button class="btn btn-accent" id="btn-signin">Sign In</button>
    <span class="auth-status" id="auth-status"></span>
    <div style="flex:1"></div>
    <button class="btn btn-ghost" id="btn-theme">Theme</button>
  </div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-search">
      <input class="search-input" id="search" placeholder="Search endpoints…">
    </div>
    <div id="nav-tree"></div>
  </nav>
  <main class="main" id="main">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">⬡</div>
      <h2>CRM API Reference</h2>
      <p>Sign in with your Firebase Emulator credentials, then pick any route from the sidebar to view its schema and test it live against this server.</p>
    </div>
    <div class="endpoint-detail" id="detail" style="display:none"></div>
  </main>
</div>

<script>
// ── Route data ────────────────────────────────────────────────────────────────
const resources = [
  {
    name: 'Health', prefix: '',
    endpoints: [
      { method: 'GET', path: '/health', auth: false,
        description: 'Probe Firestore and Firebase Auth. Returns 200 when both are reachable; 503 when degraded.',
        params: [], query: [], body: null,
        responses: [
          { status: 200, desc: 'All services healthy', example: { status: 'ok', timestamp: '2026-09-21T08:00:00.000Z', checks: { firestore: 'ok', firebaseAuth: 'ok' } } },
          { status: 503, desc: 'Degraded', example: { status: 'degraded', checks: { firestore: 'ok', firebaseAuth: 'Connection refused' } } },
        ] },
    ],
  },
  {
    name: 'Auth', prefix: '/api/v1/auth',
    endpoints: [
      { method: 'GET', path: '/api/v1/auth/me', auth: true,
        description: "Returns the current user's Firestore profile. On first login returns a minimal record from the token.",
        params: [], query: [], body: null,
        responses: [{ status: 200, desc: 'User profile', example: { id: 'FOZ6s...', name: 'Admin User', email: 'admin@crm.dev', role: 'admin', avatarInitials: 'AU' } }] },
      { method: 'POST', path: '/api/v1/auth/logout', auth: true,
        description: 'Revokes all Firebase refresh tokens for the current user.',
        params: [], query: [], body: null,
        responses: [{ status: 200, desc: 'Logged out', example: { message: 'Logged out' } }] },
      { method: 'POST', path: '/api/v1/auth/set-role', auth: true, role: 'admin',
        description: 'Assigns a custom claim role to any user. Admin only.',
        params: [], query: [],
        body: { uid: { type: 'string', required: true, desc: 'Firebase Auth UID of target user' }, role: { type: 'enum', required: true, desc: 'admin | manager | sales_agent | support' } },
        bodyExample: { uid: 'TARGET_UID', role: 'manager' },
        responses: [
          { status: 200, desc: 'Role set', example: { uid: 'TARGET_UID', role: 'manager' } },
          { status: 403, desc: 'Not an admin', example: { error: 'Forbidden' } },
        ] },
    ],
  },
  {
    name: 'Users', prefix: '/api/v1/users',
    endpoints: [
      { method: 'GET', path: '/api/v1/users', auth: true,
        description: 'List all users in the Firestore users collection.',
        params: [], query: [], body: null,
        responses: [{ status: 200, desc: 'User list', example: { data: [{ id: 'uid1', name: 'Admin User', email: 'admin@crm.dev', role: 'admin', avatarInitials: 'AU' }] } }] },
      { method: 'GET', path: '/api/v1/users/:id', auth: true,
        description: 'Get one user by Firestore doc ID.',
        params: [{ name: 'id', desc: 'User ID' }], query: [], body: null,
        responses: [{ status: 200, desc: 'User doc', example: { id: 'uid1', name: 'Admin User', role: 'admin' } }, { status: 404, desc: 'Not found', example: { error: 'User not found' } }] },
      { method: 'PATCH', path: '/api/v1/users/:id', auth: true,
        description: 'Update user fields.',
        params: [{ name: 'id', desc: 'User ID' }], query: [],
        body: { name: { type: 'string', required: false, desc: 'Display name' }, role: { type: 'enum', required: false, desc: 'admin | manager | sales_agent | support' } },
        bodyExample: { name: 'Sarah Manager', role: 'manager' },
        responses: [{ status: 200, desc: 'Updated user', example: { id: 'uid1', name: 'Sarah Manager', role: 'manager' } }] },
    ],
  },
  {
    name: 'Customers', prefix: '/api/v1/customers',
    endpoints: [
      { method: 'GET', path: '/api/v1/customers', auth: true,
        description: 'Paginated customer list. Filter by status, ownerId, tagId. Full-text search across name/email/company.',
        params: [],
        query: [{ name: 'page', desc: 'Page number (default 1)' }, { name: 'pageSize', desc: 'Max 100 (default 20)' }, { name: 'status', desc: 'Active | Inactive' }, { name: 'ownerId', desc: 'Filter by owner UID' }, { name: 'tagId', desc: 'Filter by tag ID' }, { name: 'search', desc: 'Text search on name/email/company' }],
        body: null,
        responses: [{ status: 200, desc: 'Paginated customers', example: { data: [{ id: 'cid1', firstName: 'James', lastName: 'Wilson', company: 'Acme Corp', status: 'Active' }], total: 10, page: 1, pageSize: 20, totalPages: 1 } }] },
      { method: 'POST', path: '/api/v1/customers', auth: true,
        description: 'Create a new customer. Owner fields must be denormalized.',
        params: [], query: [],
        body: { firstName: { type: 'string', required: true, desc: 'First name' }, lastName: { type: 'string', required: true, desc: 'Last name' }, email: { type: 'email', required: true, desc: 'Contact email' }, phone: { type: 'string', required: true, desc: 'Phone number' }, company: { type: 'string', required: true, desc: 'Company name' }, jobTitle: { type: 'string', required: true, desc: 'Job title' }, status: { type: 'enum', required: false, desc: 'Active | Inactive (default Active)' }, ownerId: { type: 'string', required: true, desc: 'Owner UID' }, ownerName: { type: 'string', required: true, desc: 'Owner display name' }, ownerInitials: { type: 'string', required: true, desc: 'Owner initials' }, tagIds: { type: 'string[]', required: false, desc: 'Tag IDs' } },
        bodyExample: { firstName: 'James', lastName: 'Wilson', email: 'jwilson@acme.com', phone: '+1-555-0100', company: 'Acme Corporation', jobTitle: 'CEO', status: 'Active', ownerId: 'OWNER_UID', ownerName: 'Admin User', ownerInitials: 'AU', tagIds: [] },
        responses: [{ status: 201, desc: 'Customer created', example: { id: 'cid1', firstName: 'James', lastName: 'Wilson', company: 'Acme Corporation', status: 'Active' } }, { status: 400, desc: 'Validation error', example: { error: 'Invalid request body', issues: [] } }] },
      { method: 'GET', path: '/api/v1/customers/:id', auth: true,
        description: 'Fetch a single customer by ID.',
        params: [{ name: 'id', desc: 'Customer ID' }], query: [], body: null,
        responses: [{ status: 200, desc: 'Customer doc', example: { id: 'cid1', firstName: 'James', lastName: 'Wilson' } }, { status: 404, desc: 'Not found', example: { error: 'Customer not found' } }] },
      { method: 'PATCH', path: '/api/v1/customers/:id', auth: true,
        description: 'Partial update — any fields from the create schema.',
        params: [{ name: 'id', desc: 'Customer ID' }], query: [],
        body: { status: { type: 'enum', required: false, desc: 'Active | Inactive' }, jobTitle: { type: 'string', required: false, desc: 'Job title' } },
        bodyExample: { status: 'Inactive', jobTitle: 'Former CEO' },
        responses: [{ status: 200, desc: 'Updated customer', example: { id: 'cid1', status: 'Inactive', updatedAt: '...' } }] },
      { method: 'DELETE', path: '/api/v1/customers/:id', auth: true, role: 'admin | manager',
        description: 'Delete a customer. Requires admin or manager role.',
        params: [{ name: 'id', desc: 'Customer ID' }], query: [], body: null,
        responses: [{ status: 204, desc: 'Deleted (no body)', example: null }, { status: 403, desc: 'Insufficient role', example: { error: 'Forbidden' } }] },
      { method: 'GET', path: '/api/v1/customers/:id/deals', auth: true,
        description: 'All deals linked to this customer.',
        params: [{ name: 'id', desc: 'Customer ID' }], query: [], body: null,
        responses: [{ status: 200, desc: 'Deal list', example: { data: [] } }] },
      { method: 'GET', path: '/api/v1/customers/:id/activities', auth: true,

  {

    endpoints: [
      { method: 'GET', path: '/api/v1/segments', auth: true, description: 'List saved audience segments.',
        params: [], query: [], body: null,
        responses: [{ status: 200, desc: 'Segment list', example: { data: [{ id: 'sid1', name: 'High-Value Customers', entity: 'customer' }] } }] },
      { method: 'POST', path: '/api/v1/segments', auth: true, description: 'Create a named segment with filter conditions.',
        params: [], query: [],
        body: { name: { type: 'string', required: true, desc: 'Segment name' }, entity: { type: 'enum', required: true, desc: 'customer | lead | deal' }, filters: { type: 'array', required: true, desc: '[{field, op, value}] conditions' } },
        bodyExample: { name: 'Active Enterprise Accounts', entity: 'customer', filters: [{ field: 'status', op: '==', value: 'Active' }] },
        responses: [{ status: 201, desc: 'Segment created', example: { id: 'sid1', name: 'Active Enterprise Accounts' } }] },
      { method: 'GET', path: '/api/v1/segments/:id', auth: true, description: 'Get a single segment.',
        params: [{ name: 'id', desc: 'Segment ID' }], query: [], body: null,
        responses: [{ status: 200, desc: 'Segment doc', example: { id: 'sid1', name: 'Active Enterprise Accounts' } }] },
      { method: 'DELETE', path: '/api/v1/segments/:id', auth: true, description: 'Delete a segment.',
        params: [{ name: 'id', desc: 'Segment ID' }], query: [], body: null,
        responses: [{ status: 204, desc: 'Deleted', example: null }] },
    ],
  },
  {
    name: 'Webhooks', prefix: '/api/v1/webhooks',
    endpoints: [
      { method: 'GET', path: '/api/v1/webhooks', auth: true, description: 'List registered webhook endpoints.',
        params: [], query: [], body: null,
        responses: [{ status: 200, desc: 'Webhook list', example: { data: [{ id: 'wid1', url: 'https://example.com/hook', events: ['deal.created'], active: true }] } }] },
      { method: 'POST', path: '/api/v1/webhooks', auth: true, description: 'Register a webhook that receives a JSON POST when listed events fire.',
        params: [], query: [],
        body: { url: { type: 'string', required: true, desc: 'Destination URL' }, events: { type: 'string[]', required: true, desc: 'Events to subscribe (e.g. deal.created)' }, secret: { type: 'string', required: false, desc: 'HMAC signing secret' } },
        bodyExample: { url: 'https://n8n.mycompany.com/webhook/crm', events: ['deal.created', 'deal.updated', 'customer.created'], secret: 'my-secret-key' },
        responses: [{ status: 201, desc: 'Webhook registered', example: { id: 'wid1', url: 'https://n8n.mycompany.com/webhook/crm', active: true } }] },
      { method: 'DELETE', path: '/api/v1/webhooks/:id', auth: true, description: 'Remove a webhook registration.',
        params: [{ name: 'id', desc: 'Webhook ID' }], query: [], body: null,
        responses: [{ status: 204, desc: 'Deleted', example: null }] },

  },
  {
    name: 'Audit Log', prefix: '/api/v1/audit-log',
    endpoints: [
      { method: 'GET', path: '/api/v1/audit-log', auth: true,
        description: 'Read-only trail. Every create/update/delete on customers, leads, deals, and quotes is logged automatically via writeAudit().',
        params: [],
        query: [{ name: 'entityType', desc: 'customer | lead | deal | quote' }, { name: 'entityId', desc: 'Specific entity ID' }, { name: 'actorId', desc: 'User UID' }, { name: 'page', desc: 'Page number' }, { name: 'pageSize', desc: 'Items per page' }],
        body: null,
        responses: [{ status: 200, desc: 'Audit entries', example: { data: [{ id: 'alid1', entityType: 'deal', entityId: 'did1', action: 'updated', actorId: 'uid1', before: { stage: 'Qualified' }, after: { stage: 'Proposal' }, createdAt: '...' }], total: 42 } }] },
    ],
  },

// ── State ─────────────────────────────────────────────────────────────────────
let token = '';
let activeIndex = null;

const navTree  = document.getElementById('nav-tree');
const mainEl   = document.getElementById('main');
const detailEl = document.getElementById('detail');
const welcomeEl = document.getElementById('welcome');
const searchEl  = document.getElementById('search');

// ── Sidebar builder ───────────────────────────────────────────────────────────
function buildNav(filter = '') {
  navTree.innerHTML = '';
  const fl = filter.toLowerCase();
  resources.forEach((res, ri) => {
    const eps = res.endpoints.filter(ep =>
      !fl || ep.method.toLowerCase().includes(fl) || ep.path.toLowerCase().includes(fl) || ep.description.toLowerCase().includes(fl)
    );
    if (!eps.length) return;
    const group = document.createElement('div');
    group.className = 'resource-group open';
    const header = document.createElement('div');
    header.className = 'resource-header';
    header.innerHTML = `<span class="resource-name">${res.name}</span><span class="resource-toggle">▶</span>`;
    header.onclick = () => group.classList.toggle('open');
    const list = document.createElement('div');
    list.className = 'endpoint-list';
    eps.forEach(ep => {
      const globalIdx = resources.slice(0, ri).reduce((s, r) => s + r.endpoints.length, 0) + res.endpoints.indexOf(ep);
      const item = document.createElement('div');
      item.className = 'endpoint-item' + (activeIndex === globalIdx ? ' active' : '');
      item.dataset.idx = globalIdx;
      const shortPath = ep.path.replace('/api/v1', '');
      item.innerHTML = `<span class="method-badge method-${ep.method}">${ep.method}</span><span class="ep-path">${shortPath}</span>`;
      item.onclick = () => selectEndpoint(globalIdx);
      list.appendChild(item);
    });
    group.appendChild(header);
    group.appendChild(list);
    navTree.appendChild(group);
  });
}

// ── JSON syntax highlight ─────────────────────────────────────────────────────
function highlight(json) {
  if (json === null) return '<span class="json-null">null</span>';
  return JSON.stringify(json, null, 2)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m => {
      if (/^"/.test(m)) return /:$/.test(m) ? `<span class="json-key">${m}</span>` : `<span class="json-str">${m}</span>`;
      if (/true|false/.test(m)) return `<span class="json-bool">${m}</span>`;
      if (/null/.test(m)) return `<span class="json-null">${m}</span>`;
      return `<span class="json-num">${m}</span>`;
    });
}

function getEndpoint(idx) {
  let count = 0;
  for (const res of resources) { for (const ep of res.endpoints) { if (count === idx) return ep; count++; } }
  return null;
}

// ── Render endpoint ───────────────────────────────────────────────────────────
function selectEndpoint(idx) {
  activeIndex = idx;
  const ep = getEndpoint(idx);
  if (!ep) return;
  welcomeEl.style.display = 'none';
  detailEl.style.display = 'block';
  buildNav(searchEl.value);

  const mc = { GET: 'var(--get)', POST: 'var(--post)', PATCH: 'var(--patch)', DELETE: 'var(--delete)' };
  const mb = { GET: 'var(--get-bg)', POST: 'var(--post-bg)', PATCH: 'var(--patch-bg)', DELETE: 'var(--delete-bg)' };
  const methodColor = mc[ep.method] || 'var(--accent)';
  const methodBg    = mb[ep.method] || 'var(--accent-dim)';

  const pathParamInputs = (ep.params || []).map(p =>
    `<div class="tryit-field"><label class="tryit-label">:${p.name}</label><input class="tryit-input" data-param="${p.name}" placeholder="${p.desc}"></div>`
  ).join('');
  const queryInputs = (ep.query || []).map(q =>
    `<div class="tryit-field"><label class="tryit-label">?${q.name}</label><input class="tryit-input" data-query="${q.name}" placeholder="${q.desc}"></div>`
  ).join('');
  const bodyArea = ep.body
    ? `<div><div class="section-title">Request Body</div><textarea class="tryit-body-area" id="ti-body">${ep.bodyExample ? JSON.stringify(ep.bodyExample, null, 2) : ''}</textarea></div>`
    : '';
  const schemaRows = ep.body ? Object.entries(ep.body).map(([k, v]) =>
    `<tr><td>${k}${v.required ? '<span class="required-dot">*</span>' : ''}</td><td>${v.type}</td><td>${v.desc}</td></tr>`
  ).join('') : '';
  const responseHtml = ep.responses.map(r => {
    const cls = r.status < 300 ? 's2xx' : r.status < 500 ? 's4xx' : 's5xx';
    return `<div class="response-example"><div class="response-status-row"><span class="status-badge ${cls}">${r.status}</span><span class="status-desc">${r.desc}</span></div>${r.example !== null ? `<div class="code-block">${highlight(r.example)}</div>` : '<div class="code-block" style="color:var(--text-3)">No body</div>'}</div>`;
  }).join('');
  const authBadge = ep.auth
    ? `<span class="ep-auth-badge required">🔒 Bearer token</span>${ep.role ? `<span class="ep-auth-badge required">${ep.role}</span>` : ''}`
    : `<span class="ep-auth-badge">public</span>`;
  const hasParams = (ep.params && ep.params.length) || (ep.query && ep.query.length);

  detailEl.innerHTML = `
    <div class="ep-header">
      <div class="ep-title-row">
        <span class="method-badge-lg method-${ep.method}" style="background:${methodBg};color:${methodColor}">${ep.method}</span>
        <span class="ep-path-lg">${ep.path}</span>
        ${authBadge}
      </div>
      <p class="ep-description">${ep.description}</p>
    </div>
    ${ep.query && ep.query.length ? `<div class="section"><div class="section-title">Query Parameters</div><table class="param-table"><thead><tr><th>Name</th><th>Type</th><th>Description</th></tr></thead><tbody>${ep.query.map(q=>`<tr><td>${q.name}</td><td>string</td><td>${q.desc}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${ep.body ? `<div class="section"><div class="section-title">Request Body Schema</div><table class="param-table"><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody>${schemaRows}</tbody></table></div>` : ''}
    <div class="section"><div class="section-title">Responses</div><div class="response-examples">${responseHtml}</div></div>
    <div class="tryit-section">
      <div class="tryit-header"><h3>TRY IT LIVE</h3><span style="color:var(--text-3);font-size:11px;font-family:'JetBrains Mono',monospace">hits this server</span></div>
      <div class="tryit-body">
        <div class="tryit-url-row">
          <span class="tryit-url-method" style="color:${methodColor}">${ep.method}</span>
          <span class="tryit-url-text" id="ti-url-display">${ep.path}</span>
        </div>
        ${hasParams ? `<div class="tryit-param-grid">${pathParamInputs}${queryInputs}</div>` : ''}
        ${bodyArea}
        <div class="tryit-actions">
          <button class="btn-send" id="ti-send">Send Request</button>
          <span class="tryit-timing" id="ti-timing"></span>
          ${ep.auth && !token ? '<span style="color:var(--patch);font-size:11px;font-family:JetBrains Mono,monospace">⚠ Sign in first</span>' : ''}
        </div>
        <div id="ti-response"></div>
      </div>
    </div>`;

  function updateUrl() {
    const base = document.getElementById('cfg-base').value.replace(/\/$/, '');
    let path = ep.path;
    detailEl.querySelectorAll('[data-param]').forEach(inp => {
      if (inp.value.trim()) path = path.replace(':' + inp.dataset.param, inp.value.trim());
    });
    const qps = [];
    detailEl.querySelectorAll('[data-query]').forEach(inp => {
      if (inp.value.trim()) qps.push(`${inp.dataset.query}=${encodeURIComponent(inp.value.trim())}`);
    });
    document.getElementById('ti-url-display').textContent = base + path + (qps.length ? '?' + qps.join('&') : '');
  }
  detailEl.querySelectorAll('[data-param],[data-query]').forEach(inp => inp.addEventListener('input', updateUrl));
  updateUrl();

  document.getElementById('ti-send').onclick = async () => {
    const btn = document.getElementById('ti-send');
    btn.disabled = true; btn.textContent = 'Sending…';
    document.getElementById('ti-timing').textContent = '';
    document.getElementById('ti-response').innerHTML = '';

    const base = document.getElementById('cfg-base').value.replace(/\/$/, '');
    let path = ep.path;
    detailEl.querySelectorAll('[data-param]').forEach(inp => {
      path = path.replace(':' + inp.dataset.param, inp.value.trim() || ':' + inp.dataset.param);
    });
    const qps = [];
    detailEl.querySelectorAll('[data-query]').forEach(inp => {
      if (inp.value.trim()) qps.push(`${inp.dataset.query}=${encodeURIComponent(inp.value.trim())}`);
    });
    const url = base + path + (qps.length ? '?' + qps.join('&') : '');
    const headers = { 'Content-Type': 'application/json' };
    if (ep.auth && token) headers['Authorization'] = 'Bearer ' + token;
    const bodyEl = document.getElementById('ti-body');
    const t0 = performance.now();
    try {
      const res = await fetch(url, { method: ep.method, headers, body: (ep.body && bodyEl) ? bodyEl.value.trim() || undefined : undefined });
      const elapsed = Math.round(performance.now() - t0);
      document.getElementById('ti-timing').textContent = `${elapsed}ms`;
      const text = await res.text();
      let parsed; try { parsed = JSON.parse(text); } catch { parsed = text; }
      const cls = res.status < 300 ? 's2xx' : res.status < 500 ? 's4xx' : 's5xx';
      document.getElementById('ti-response').innerHTML = `<div class="response-panel"><div class="response-bar"><span class="response-code ${cls}">${res.status} ${res.statusText}</span><span class="response-time">${elapsed}ms</span></div><div class="response-body">${typeof parsed === 'string' ? parsed : highlight(parsed)}</div></div>`;
    } catch (err) {
      document.getElementById('ti-response').innerHTML = `<div class="response-panel"><div class="response-body" style="color:var(--delete)">${err.message}</div></div>`;
    }
    btn.disabled = false; btn.textContent = 'Send Request';
  };
  mainEl.scrollTo(0, 0);
}

// ── Sign in ───────────────────────────────────────────────────────────────────
document.getElementById('btn-signin').onclick = async () => {
  const base  = document.getElementById('cfg-base').value.replace(/\/$/, '');
  const email = document.getElementById('cfg-email').value.trim();
  const pass  = document.getElementById('cfg-pass').value;
  const status = document.getElementById('auth-status');
  status.textContent = 'Signing in…'; status.className = 'auth-status';
  try {
    // Call the backend sign-in proxy — works for both emulator and real Firebase
    const res = await fetch(`${base}/api/v1/auth/sign-in`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass }),
    });
    const data = await res.json();
    if (!data.idToken) throw new Error(data.error || 'Sign-in failed');
    token = data.idToken;
    status.textContent = `✓ ${email}`; status.className = 'auth-status';
    document.getElementById('btn-signin').textContent = 'Refresh';
    if (activeIndex !== null) selectEndpoint(activeIndex);
  } catch (err) {
    status.textContent = `✗ ${err.message}`; status.className = 'auth-status error';
  }
};

searchEl.addEventListener('input', () => buildNav(searchEl.value));
document.getElementById('btn-theme').onclick = () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
};

// ── Init — default base URL to this server's origin ───────────────────────────
document.getElementById('cfg-base').value = window.location.origin;
buildNav();
</script>
</body>
